name: Build Addon
on:
  workflow_dispatch:
  # push:
    # branches: [ "master" ]

# permissions:
  # contents: write
  # pages: write
  # id-token: write

env:
  PLUGIN_VERSION: 1.5.2
  GODOT_VERSION: 4.7

jobs:
  build-addon:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout directory
        uses: actions/checkout@v7
        with:
          lfs: true
        
      - name: Zip the directory
        run: |
          cd godot
          ADDON_ARCHIVE="cyclops_level_builder_${{ env.PLUGIN_VERSION }}_for_Godot_${{ env.GODOT_VERSION }}.zip"
          zip -r ${ADDON_ARCHIVE} addons
      
      - name: Upload zip as an artifact
        uses: actions/upload-artifact@v7
        with:
          path: godot/cyclops_level_builder_${{ env.PLUGIN_VERSION }}_for_Godot_${{ env.GODOT_VERSION }}.zip
          archive: false

          
        
